name: Deploy Bot (Fly.io)

# Triggered only after CI finishes successfully on `main`. This enforces the
# "no red builds deploy" rule — lint/typecheck/build/db-verify must all pass.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Fly.io
    runs-on: ubuntu-latest
    # Only deploy when the triggering CI run was SUCCESS.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout (the commit that passed CI)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bot
        run: |
          pnpm --filter @vehiclefinance/shared build
          pnpm --filter @vehiclefinance/bot build

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --config packages/bot/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

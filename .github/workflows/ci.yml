name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @vehiclefinance/shared build

      - name: Typecheck — shared
        run: pnpm --filter @vehiclefinance/shared typecheck

      - name: Typecheck — bot
        run: pnpm --filter @vehiclefinance/bot typecheck

      - name: Typecheck — web
        run: pnpm --filter @vehiclefinance/web typecheck

  build:
    name: Build all packages
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  unit-tests:
    name: Unit tests (bot + web)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile

      # Bot tests — optional (no test script yet)
      - name: Bot tests
        run: |
          if pnpm --filter @vehiclefinance/bot run --if-present test -- --run 2>/dev/null; then
            echo "bot tests ran"
          else
            echo "bot tests skipped (no test script or no tests)"
          fi

      # Web tests — REQUIRED. Fail the build on any vitest failure.
      - name: Web unit tests
        run: pnpm --filter @vehiclefinance/web run test

      - name: Web coverage report
        run: pnpm --filter @vehiclefinance/web run test:coverage
        continue-on-error: true # report-only for now, until thresholds are set

      - name: Upload web coverage as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: packages/web/coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e-tests:
    name: Playwright E2E (unauth + visual-rebrand)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium only)
        run: pnpm --filter @vehiclefinance/web exec playwright install --with-deps chromium

      # Run only the projects that don't require an authenticated session.
      # The auth-gated specs (dashboard, deal-detail, queue tasks) skip cleanly
      # when E2E_ADMIN_TOKEN is unset.
      - name: Run unauth + visual-rebrand specs
        run: |
          cd packages/web
          pnpm exec playwright test \
            e2e/unauth.spec.ts \
            e2e/visual-rebrand.spec.ts \
            --project=chromium-unauth \
            --project=chromium-auth \
            --reporter=list,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/e2e/.report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: packages/web/e2e/.test-results/
          if-no-files-found: ignore
          retention-days: 7

  db-verify:
    # Applies every migration in packages/api/supabase/migrations/ to a fresh
    # Supabase branch, then runs the Deno integration test suite against it.
    # This is THE Phase 0 verification — it proves the repo can reproduce the DB
    # on a fresh project.
    name: DB migrations + integration tests (ephemeral Supabase branch)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, build]
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID:   ${{ secrets.SUPABASE_PROJECT_ID }}
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install Deno (for integration tests)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Create ephemeral Supabase branch
        id: branch
        run: |
          set -e
          BRANCH_NAME="ci-${{ github.run_id }}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase branches create "$BRANCH_NAME" --experimental --project-ref "$SUPABASE_PROJECT_ID"
          # Wait for the branch DB to be ready (up to 2 minutes).
          for i in $(seq 1 24); do
            STATUS=$(supabase branches list --project-ref "$SUPABASE_PROJECT_ID" \
              | awk -v b="$BRANCH_NAME" '$0 ~ b {print $3}')
            if [ "$STATUS" = "FUNCTIONS_DEPLOYED" ] || [ "$STATUS" = "MIGRATIONS_PASSED" ] || [ "$STATUS" = "ACTIVE_HEALTHY" ]; then
              break
            fi
            sleep 5
          done

      - name: Push migrations to ephemeral branch
        run: |
          supabase db push --linked --include-all

      - name: Fetch branch connection details
        id: branch_details
        run: |
          # supabase branches get may not exist in every CLI version; fall back to API if so.
          DETAILS=$(supabase branches get "${{ steps.branch.outputs.branch_name }}" --project-ref "$SUPABASE_PROJECT_ID" --experimental 2>/dev/null || true)
          BRANCH_URL=$(echo "$DETAILS" | awk '/db_host|url/ {print $2; exit}')
          echo "branch_url=https://${BRANCH_URL#https://}" >> $GITHUB_OUTPUT

      - name: Run Deno integration tests against branch
        env:
          SUPABASE_URL: ${{ steps.branch_details.outputs.branch_url }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
        run: |
          cd packages/api/tests
          deno task test

      - name: Destroy ephemeral Supabase branch
        if: always()
        run: |
          supabase branches delete "${{ steps.branch.outputs.branch_name }}" --project-ref "$SUPABASE_PROJECT_ID" --experimental || echo "branch may already be gone"

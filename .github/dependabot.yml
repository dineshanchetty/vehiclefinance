version: 2

updates:
  # Root workspace / all npm packages
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 10
    groups:
      # Group all minor/patch updates to reduce noise
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - automated
    ignore:
      # Major version bumps need human review
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
      - automated
